<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .container-form{
            max-width: 600px;
            width: 100%;
            background: white;
            height: 300px;
            box-shadow: 2px 2px 10px 0 rgba(0,0,0, .1);
            border-radius: 5px;
            margin-top: 70px;
            /*padding-bottom: 20px;*/
        }
        body{
            background-color: #f2f3f4;
        }
    </style>

</head>
<body>
    
    <main>
        <section class="mx-auto container-form">
            <form action="pagina1.html" method="get">
                <div class="container">
                    <div class="row">
                        <div class="col-12">
                            <div class="mt-4">
                                <label for="">Usuario</label>
                                <input class="form-control user" type="text" required>
                                <p class="text-danger m-0 text-user"></p>
                            </div>
                            <div class="mt-3">
                                <label for="">Contraseña</label>
                                <input class="form-control password" type="password" required>
                                <p class="text-danger m-0 text-password"></p>
                            </div>
                            <div class="mt-3 text-center">
                                <button class="btn btn-primary mx-auto btn-submit mr-2">Enviar</button>
                                <button class="btn btn-secondary" onclick="irAdelante()">Ir adelante</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <p>contador de numeros: <output id="resultado"></output></p>
        <button onclick="empezarWorker()">Empezar worker</button>
        <button onclick="detenerWorker()">Detener worker</button>

        <button onclick="Obtenerlocation()">Obtener geolocation</button>


    </main>
    <script>

        //api worker: prog sin afectar rendimiento de navegador
        function empezarWorker() {
            if(typeof(w) == "undefined"){
                /*var*/ w = new Worker("workers.js");
                //al no declarar una variable, auto crea una var global
            }
            w.onmessage = function(event){
                document.querySelector('#resultado').innerText = event.data;
            }

        }

        function detenerWorker(){
            w.terminate();
            w = undefined;
        }

        //api geolocation

        const Obtenerlocation = () => {
            if(navigator.geolocation){
                navigator.geolocation.getCurrentPosition(mostrarPosicion);
            }

        }

        function mostrarPosicion(position){
            var latitud = position.coords.latitude;
            var longitud = position.coords.longitude;
            console.log(latitud);
            console.log(longitud);

         }

    </script>

</body>
</html>
